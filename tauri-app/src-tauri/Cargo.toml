[package]
name = "shiprocket-label-processor"
version = "1.0.0"
description = "Shiprocket Label Processor"
authors = ["Tulir Naturals"]
edition = "2021"

[lib]
name = "shiprocket_label_processor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mupdf = "0.5"
lopdf = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = "0.4"
rand = "0.8"
dirs = "5"
regex = "1"

[[bin]]
name = "extract-test"
path = "src/bin/extract_test.rs"

[[bin]]
name = "shiprocket-label-processor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
